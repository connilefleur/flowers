<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tiny cat delivery service</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink:  #D9897E;
  --brown: #A97B5A;
  --teal:  #5B9BAF;
  --black: #2B2218;
  --cream: #EDE6D3;
  --gold:  #C99B52;
  --sky:   #C0D4E0;
}

body {
  min-height: 100vh;
  background: linear-gradient(to bottom, var(--pink) 55%, var(--brown) 55%);
  background-attachment: fixed;
  font-family: 'Nunito', sans-serif;
  overflow: hidden;
}

.page {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.page.active { opacity: 1; pointer-events: auto; }

.btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.65rem;
  color: var(--cream);
  background: var(--black);
  border: none;
  padding: 14px 26px;
  cursor: pointer;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
  transition: transform 0.08s, box-shadow 0.08s;
  letter-spacing: 0.04em;
  line-height: 1;
}
.btn:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(0,0,0,0.35); }
.btn:active { transform: translate(3px,3px);   box-shadow: 1px 1px 0 rgba(0,0,0,0.35); }

@keyframes blink { 0%,49%{opacity:1}50%,100%{opacity:0} }
@keyframes bob   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

/* ─────────────── START ─────────────── */
.title-main {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(1rem, 4vw, 1.4rem);
  color: var(--black);
  text-align: center;
  line-height: 1.8;
}
.title-sub {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(0.42rem, 1.5vw, 0.55rem);
  color: var(--black);
  opacity: 0.45;
  letter-spacing: 0.06em;
}

/* ─────────────── DELIVERY ─────────────── */
#page-delivery {
  padding: 0;
  gap: 0;
  justify-content: flex-start;
}

.hdr {
  width: 100%;
  background: var(--black);
  padding: 9px 16px;
  text-align: center;
  flex-shrink: 0;
}
.hdr span {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.48rem;
  color: var(--cream);
  letter-spacing: 0.1em;
}

.track {
  width: 100%;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
  height: 210px;
  border-bottom: 3px solid var(--black);
}
.track-sky {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: var(--sky);
  border-bottom: 3px solid var(--black);
}
.track-ground {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 38%;
  background: var(--brown);
  border-top: 3px solid var(--black);
}

#trail-canvas {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

/* pixel art delivery cat */
#delivery-cat {
  position: absolute;
  bottom: 38%;
  z-index: 4;
  width: 52px;
  height: auto;
  image-rendering: pixelated;
}

#waiting-girl {
  position: absolute;
  bottom: 0;
  right: 20px;
  height: 112px;
  image-rendering: pixelated;
  z-index: 3;
}

/* status area */
.status-area {
  width: 100%;
  background: var(--cream);
  padding: 18px 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  border-bottom: 3px solid var(--black);
  flex-shrink: 0;
}
.status-lbl {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.38rem;
  color: var(--black);
  opacity: 0.4;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.status-msg {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.6rem;
  color: var(--black);
  line-height: 1.8;
}
.cur { animation: blink 1s step-end infinite; }

.pip-row { display: flex; gap: 5px; }
.pip {
  width: 13px; height: 13px;
  border: 2px solid var(--black);
  background: var(--cream);
}
.pip.done { background: var(--gold); }
.pip.now  { background: var(--teal); animation: blink 0.75s step-end infinite; }

/* ─────────────── DELIVERED ─────────────── */
.delivered-big {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(1rem, 4.5vw, 1.6rem);
  color: var(--black);
  text-align: center;
  line-height: 1.8;
}
.for-you {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.5rem;
  color: var(--black);
  opacity: 0.45;
  letter-spacing: 0.07em;
}
.delivered-girl {
  width: clamp(110px, 32vw, 170px);
  image-rendering: pixelated;
  display: block;
}
.receipt {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.48rem;
  color: var(--black);
  text-align: center;
  line-height: 2.4;
  padding: 13px 22px;
  border: 3px solid var(--black);
  background: var(--cream);
  box-shadow: 4px 4px 0 var(--black);
}
.countdown {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.5rem;
  color: var(--cream);
  background: var(--black);
  padding: 16px 24px 20px;
  border: 3px solid var(--black);
  box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
  line-height: 1.6;
  text-align: center;
  letter-spacing: 0.05em;
}
.countdown-number {
  display: block;
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(2.8rem, 14vw, 4.5rem);
  color: var(--gold);
  line-height: 1;
  margin: 8px 0 4px;
  text-shadow: 4px 4px 0 rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<!-- ═══ START ═══════════════════════════════════════ -->
<div class="page active" id="page-start">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 26"
       style="width:clamp(90px,28vw,130px);height:auto;image-rendering:pixelated;animation:bob 1.2s ease-in-out infinite">
    <rect fill="#3a3028" x="2"  y="0"  width="3" height="4"/>
    <rect fill="#3a3028" x="13" y="0"  width="3" height="4"/>
    <rect fill="#4a3c2e" x="3"  y="1"  width="1" height="2"/>
    <rect fill="#4a3c2e" x="14" y="1"  width="1" height="2"/>
    <rect fill="#2B2218" x="1"  y="3"  width="16" height="10"/>
    <rect fill="#EDE6D3" x="3"  y="5"  width="4" height="4"/>
    <rect fill="#2B2218" x="4"  y="6"  width="2" height="3"/>
    <rect fill="#EDE6D3" x="11" y="5"  width="4" height="4"/>
    <rect fill="#2B2218" x="12" y="6"  width="2" height="3"/>
    <rect fill="#D98888" x="8"  y="10" width="2" height="2"/>
    <rect fill="#5B9BAF" x="2"  y="13" width="14" height="8"/>
    <rect fill="#EDE6D3" x="6"  y="14" width="1" height="6"/>
    <rect fill="#EDE6D3" x="8"  y="14" width="1" height="6"/>
    <rect fill="#EDE6D3" x="10" y="14" width="1" height="6"/>
    <rect fill="#2B2218" x="3"  y="21" width="4" height="5"/>
    <rect fill="#2B2218" x="11" y="21" width="4" height="5"/>
    <rect fill="#2B2218" x="2"  y="24" width="5" height="2"/>
    <rect fill="#2B2218" x="11" y="24" width="5" height="2"/>
  </svg>
  <p class="title-main">tiny cat<br>delivery</p>
  <p class="title-sub">1 flower · ready to send</p>
  <button class="btn" id="btn-send">send flower</button>
</div>

<!-- ═══ DELIVERY ════════════════════════════════════ -->
<div class="page" id="page-delivery">
  <div class="hdr"><span>▸ tiny cat delivery service ◂</span></div>

  <div class="track" id="track">
    <div class="track-sky"></div>
    <div class="track-ground"></div>
    <canvas id="trail-canvas"></canvas>

    <svg id="delivery-cat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 26"
         style="image-rendering:pixelated">
      <!-- ears -->
      <rect fill="#3a3028" x="2"  y="0"  width="3" height="4"/>
      <rect fill="#3a3028" x="13" y="0"  width="3" height="4"/>
      <rect fill="#4a3c2e" x="3"  y="1"  width="1" height="2"/>
      <rect fill="#4a3c2e" x="14" y="1"  width="1" height="2"/>
      <!-- head -->
      <rect fill="#2B2218" x="1"  y="3"  width="16" height="10"/>
      <!-- eyes -->
      <rect fill="#EDE6D3" x="3"  y="5"  width="4" height="4"/>
      <rect fill="#2B2218" x="4"  y="6"  width="2" height="3"/>
      <rect fill="#EDE6D3" x="11" y="5"  width="4" height="4"/>
      <rect fill="#2B2218" x="12" y="6"  width="2" height="3"/>
      <!-- nose -->
      <rect fill="#D98888" x="8"  y="10" width="2" height="2"/>
      <!-- sweater -->
      <rect fill="#5B9BAF" x="2"  y="13" width="14" height="8"/>
      <rect fill="#EDE6D3" x="6"  y="14" width="1" height="6"/>
      <rect fill="#EDE6D3" x="8"  y="14" width="1" height="6"/>
      <rect fill="#EDE6D3" x="10" y="14" width="1" height="6"/>
      <!-- legs A -->
      <g id="legs-a">
        <rect fill="#2B2218" x="3"  y="21" width="4" height="5"/>
        <rect fill="#2B2218" x="11" y="21" width="4" height="5"/>
        <rect fill="#2B2218" x="2"  y="24" width="5" height="2"/>
        <rect fill="#2B2218" x="11" y="24" width="5" height="2"/>
      </g>
      <!-- legs B -->
      <g id="legs-b" style="display:none">
        <rect fill="#2B2218" x="2"  y="22" width="4" height="4"/>
        <rect fill="#2B2218" x="12" y="20" width="4" height="6"/>
        <rect fill="#2B2218" x="1"  y="25" width="5" height="2"/>
        <rect fill="#2B2218" x="12" y="25" width="5" height="2"/>
      </g>
      <!-- carried flower -->
      <g id="carried-flower">
        <rect fill="#C99B52" x="15" y="0"  width="3" height="3"/>
        <rect fill="#C99B52" x="14" y="1"  width="5" height="1"/>
        <rect fill="#7B4F30" x="15" y="1"  width="1" height="1"/>
        <rect fill="#5a8a3a" x="16" y="3"  width="1" height="4"/>
      </g>
    </svg>

    <img id="waiting-girl" src="IMG_0463.PNG" alt="">
  </div>

  <div class="status-area">
    <div class="status-lbl">status</div>
    <div class="status-msg" id="status-text">packing flower<span class="cur">_</span></div>
    <div class="pip-row">
      <div class="pip" id="pip-0"></div>
      <div class="pip" id="pip-1"></div>
      <div class="pip" id="pip-2"></div>
      <div class="pip" id="pip-3"></div>
      <div class="pip" id="pip-4"></div>
      <div class="pip" id="pip-5"></div>
      <div class="pip" id="pip-6"></div>
    </div>
  </div>
</div>

<!-- ═══ DELIVERED ═══════════════════════════════════ -->
<div class="page" id="page-delivered">
  <p class="delivered-big">delivered<br>:)</p>
  <p class="for-you">for you</p>
  <img class="delivered-girl" id="delivered-girl" src="DFAC3C11-B660-4CF7-B1AE-D940EF714C67.PNG" alt="">
  <div class="receipt">contents: 1 flower<br>courier: cat</div>
  <div class="countdown">
    days until we meet
    <span class="countdown-number" id="days-count"></span>
  </div>
  <button class="btn" id="btn-again">send again</button>
</div>

<script>
'use strict';

const RAINBOW = ['#b05868','#b07040','#a09040','#4a7850','#3f6890','#724880'];
const STRIPE_H = 6;

let phase = 'start';
let raf = null, startTime = 0, lastFrame = 0;
let catX = 0, destX = 0;
let walkFrame = 0, walkMs = 0;
const WALK_INTERVAL = 100; // ms between leg swaps
const SPEED = 0.065;       // px per ms (~65px/s)

const STEPS = [
  { at:    0, text: 'packing flower',        pips: 1 },
  { at:  600, text: 'cat dispatched',        pips: 2 },
  { at: 1700, text: 'crossing the distance', pips: 4 },
  { at: 3000, text: 'almost there',          pips: 6 },
];
let lastStep = -1;

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setPips(count) {
  for (let i = 0; i < 7; i++) {
    const pip = document.getElementById('pip-' + i);
    pip.className = 'pip';
    if (i < count - 1)    pip.classList.add('done');
    else if (i === count - 1) pip.classList.add('now');
  }
}

function startDelivery() {
  phase = 'delivering';
  catX  = -60;
  walkFrame = 0; walkMs = 0; lastStep = -1;

  document.getElementById('status-text').innerHTML =
    'packing flower<span class="cur">_</span>';
  document.getElementById('carried-flower').style.display = '';
  document.getElementById('legs-a').style.display        = '';
  document.getElementById('legs-b').style.display        = 'none';
  setPips(1);

  // show page first so layout is live before measuring
  showPage('page-delivery');

  const track  = document.getElementById('track');
  const canvas = document.getElementById('trail-canvas');
  canvas.width  = track.offsetWidth;
  canvas.height = track.offsetHeight;

  // measure girl width from natural image dimensions if loaded, else fallback
  const girl  = document.getElementById('waiting-girl');
  const girlW = girl.naturalWidth > 0
    ? Math.round(girl.offsetHeight * girl.naturalWidth / girl.naturalHeight)
    : 54;
  destX = track.offsetWidth - girlW - 20 - 65;

  startTime = lastFrame = performance.now();
  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(loop);
}

function loop(now) {
  const elapsed = now - startTime;
  const dt = Math.min(now - lastFrame, 64); // cap at ~1 dropped frame
  lastFrame = now;

  for (let i = STEPS.length - 1; i >= 0; i--) {
    if (elapsed >= STEPS[i].at) {
      if (i !== lastStep) {
        lastStep = i;
        document.getElementById('status-text').innerHTML =
          STEPS[i].text + '<span class="cur">_</span>';
        setPips(STEPS[i].pips);
      }
      break;
    }
  }

  const arrived = catX >= destX;
  if (!arrived) {
    catX = Math.min(catX + SPEED * dt, destX);
    walkMs += dt;
    if (walkMs >= WALK_INTERVAL) {
      walkMs -= WALK_INTERVAL;
      walkFrame ^= 1;
      document.getElementById('legs-a').style.display = walkFrame === 0 ? '' : 'none';
      document.getElementById('legs-b').style.display = walkFrame === 1 ? '' : 'none';
    }
  }

  document.getElementById('carried-flower').style.display = arrived ? 'none' : '';

  const canvas = document.getElementById('trail-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const trailEnd = Math.max(0, catX + 10);

  ctx.clearRect(0, 0, W, H);
  if (trailEnd > 0) {
    const groundTop = Math.round(H * 0.62);
    const baseY     = groundTop - STRIPE_H * RAINBOW.length;
    RAINBOW.forEach((c, i) => {
      ctx.fillStyle = c;
      ctx.fillRect(0, baseY + i * STRIPE_H, trailEnd, STRIPE_H);
    });
  }

  document.getElementById('delivery-cat').style.left = Math.round(catX) + 'px';

  if (arrived && elapsed >= 4000) {
    cancelAnimationFrame(raf); raf = null;
    document.getElementById('status-text').innerHTML = 'delivered.';
    setPips(7);
    setTimeout(showDelivered, 700);
    return;
  }

  raf = requestAnimationFrame(loop);
}

function daysUntilMeeting() {
  const target = new Date('2026-05-15T00:00:00');
  const now    = new Date();
  const diff   = target - now;
  if (diff <= 0) return 0;
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}

function showDelivered() {
  phase = 'delivered';
  showPage('page-delivered');
  document.getElementById('days-count').textContent = daysUntilMeeting();
  const el = document.getElementById('delivered-girl');
  el.style.transition = 'none';
  el.style.clipPath   = 'inset(100% 0 0 0)';
  el.getBoundingClientRect();
  el.style.transition = 'clip-path 0.55s ease-out';
  el.style.clipPath   = 'inset(0% 0 0 0)';
}

function stripWhite(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) {
    if (d.data[i] > 240 && d.data[i+1] > 240 && d.data[i+2] > 240)
      d.data[i+3] = 0;
  }
  ctx.putImageData(d, 0, 0);
  img.src = c.toDataURL();
}

['waiting-girl','delivered-girl'].forEach(id => {
  const img = document.getElementById(id);
  if (img.complete && img.naturalWidth) stripWhite(img);
  else img.addEventListener('load', () => stripWhite(img));
});

document.getElementById('btn-send').addEventListener('click', () => {
  if (phase === 'start') startDelivery();
});

document.getElementById('btn-again').addEventListener('click', () => {
  phase = 'start';
  const el = document.getElementById('delivered-girl');
  el.style.clipPath = el.style.transition = '';
  showPage('page-start');
});
</script>
</body>
</html>
